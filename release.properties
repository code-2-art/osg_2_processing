# 发布元数据：会被 gradle 的 writeLibraryProperties 写入根目录 library.properties
# 详见 https://github.com/processing/processing/wiki/Library-Basics

# 在 Contributions Manager 中显示的库名
name=CPP Native Library (cpplib)

# 发布计数（必须能解析成 int，用于判断更新）
version=1

# 语义化版本，尽量与 cpp/CMakeLists.txt 中的 CPPLIB_VERSION 保持一致
prettyVersion=1.0.0

# 作者列表，可用 [author](url) 语法
authors=[Your Name](https://example.com)

# 库主页（不是 jar 直链）
url=https://example.com/cpplib

# 类别，必须是官方列表中的一项或多项（逗号分隔）
categories=Utilities

# 一句话描述（首字母大写，以句号结尾），显示在 Contributions Manager
sentence=A minimal JNI bridge that lets Processing sketches call your C++/CUDA code.

# 补充说明（会自动接在 sentence 后面）
paragraph=Built with CMake. Includes an algorithm-only example and an OpenGL drawing example.

# 兼容的 Processing min/max revision（0 表示不限，一般保持 0）
minRevision=0
maxRevision=0
